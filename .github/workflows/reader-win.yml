name: reader-win

# 국어나래 낭독 도우미(윈도우 앱 시험판) 설치 파일을 만든다. 코드 서명은 하지 않아요(비밀값 없음).
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/reader-win/**"
      - "src/core/speech/**"
      - "src/core/fluency/**"
      - ".github/workflows/reader-win.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/reader-win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/reader-win/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: narae-reader-setup
          path: apps/reader-win/dist/*.exe
          if-no-files-found: error
